map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name dev.991hahahanxsm.xyz;

    client_max_body_size 20m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /assistant/new-api {
        return 301 /assistant/new-api/;
    }

    location /assistant/new-api/ {
        auth_request /api/v1/assistant/new-api/auth/;
        error_page 401 = @gemshin_login;
        error_page 403 = @gemshin_forbidden;

        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /assistant/new-api;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        proxy_cookie_path / /assistant/new-api/;
        proxy_redirect ~^(/.*)$ /assistant/new-api$1;

        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'href="/' 'href="/assistant/new-api/';
        sub_filter 'src="/' 'src="/assistant/new-api/';
        sub_filter 'action="/' 'action="/assistant/new-api/';
        sub_filter 'url(/' 'url(/assistant/new-api/';
    }

    location @gemshin_login {
        return 302 /?redirect=/assistant;
    }

    location @gemshin_forbidden {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
