services:
  mysql:
    image: mysql:8.4
    container_name: gemshin-dev-db-test
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - gemshin_dev_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: gemshin-dev-redis-test
    restart: unless-stopped
    volumes:
      - gemshin_dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gemshin-dev-api
    restart: unless-stopped
    env_file:
      - ${GEMSHIN_ENV_FILE:-.env.dev}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8101:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: gemshin-dev-web
    restart: unless-stopped
    env_file:
      - ${GEMSHIN_ENV_FILE:-.env.dev}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3101:3000"

  newapi:
    image: calciumion/new-api@sha256:5a4ca9705f13a000ea85a43c179c4f4f6c6409cdee5b2d7a56df32a9818c783a
    container_name: gemshin-dev-newapi-test
    restart: unless-stopped
    volumes:
      - /opt/gemshin-dev/new-api/data:/data
      - /opt/gemshin-dev/new-api/logs:/app/logs
    ports:
      - "127.0.0.1:3002:3000"

volumes:
  gemshin_dev_mysql_data:
  gemshin_dev_redis_data:
